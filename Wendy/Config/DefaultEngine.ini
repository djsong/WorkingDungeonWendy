; Required by the Voice module (IVoiceCapture / Opus encoder+decoder). Without this key FVoiceModule
; disables itself and every Create* call returns null, logging only a warning about the missing key.
[Voice]
bEnabled=true

[SystemSettings]
; The engine defaults (0.08 for both, ~-22 dBFS on a smoothed envelope) are tuned to suppress background
; noise in a shipping game, and are high enough that ordinary speech is classified as silence - the capture
; then reports NoData and hands back nothing at all. Wendy is a voice-chat app, so bias towards capturing.
; SilenceDetection decides whether we get any data; the noise gate can still attenuate what passes to
; silence, so both have to come down together.
voice.SilenceDetectionThreshold=0.01
voice.MicNoiseGateThreshold=0.01
; Raise this if a quiet microphone still doesn't register (1.0 = unity, linear amplitude).
voice.MicInputGain=1.0

